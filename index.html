<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Linky</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="dark">
  <div class="container">
    <aside class="sidebar">
      <h2>Scanned Links</h2>
      <ul id="savedResults"></ul>
      <button id="clearSavedBtn">🗑️ Clear All</button>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1>Linky Scanner</h1>
      </div>

      <div class="scanner">
        <input type="text" id="urlInput" placeholder="Enter website.com" autocomplete="off" />
        <button id="scanBtn" onclick="checkLink()">🚦 Scan</button>
        <div id="loadingBar" class="loading-bar hidden"></div>
        <p id="result">Result will appear here.</p>
        <button id="saveBtn" class="hidden">⭐ Save Result</button>
        <p class="scan-note" style="margin-top:12px;font-size:0.98rem;color:#ffb347;max-width:500px;text-align:center;">
          <strong>Note:</strong> The scan might take longer than 5 minutes if the Hugging Face Space is sleeping due to inactivity. Please wait for the backend to wake up.
        </p>
      </div>
    </main>
  </div>

  <script type="module" src="script.js"></script>
  <div class="footer-signature" style="position:fixed;bottom:16px;right:24px;font-size:1.05rem;color:#ffb347;z-index:1000;user-select:none;pointer-events:none;">
    made with <span style="color:#ff3c3c;">♥</span> by krish
  </div>
</body>
</html>
